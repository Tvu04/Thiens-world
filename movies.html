<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movies & TV Shows · Thien's Little World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=galaxy1">
</head>
<body data-page="movies">
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div id="sparkles"></div>
<div id="progress"></div>
<div class="grain"></div>
<nav id="nav">
  <a href="index.html" data-p="home">🏠 Home</a>
  <a href="games.html" data-p="games">🎮 Games</a>
  <a href="kpop.html" data-p="kpop">💗 K-Drama/K-Pop</a>
  <a href="music.html" data-p="music">🎧 Music</a>
  <a href="movies.html" data-p="movies">🎬 Movies/TV</a>
</nav>
<header class="small">
  <div class="page-icon ic-movies">🎬</div>
  <h1>Movies &amp; TV Shows</h1>
  <p class="tagline">grab some popcorn, these are my comfort watches 🍿</p>
</header>
<main>
  <section id="movies" class="page">
    <div class="toolbar"><a class="back" href="index.html">← back home</a><span class="count" id="count"></span><button class="add-btn" data-sec="movies">+ Add title</button></div>
    <div class="grid" id="grid-movies"></div>
  </section>
</main>
<footer>
  <div class="sig">made with love ♡ Thien</div>
  <p>✦ thanks for stopping by ✦</p>
</footer>
<div class="overlay" id="overlay">
  <form class="modal" id="form">
    <h3 id="m-title">Add something ✨</h3>
    <label for="f-name">Title</label>
    <input id="f-name" required maxlength="60">
    <label for="f-meta" id="l-meta">Details</label>
    <input id="f-meta" maxlength="60">
    <label for="f-note">Why I love it</label>
    <textarea id="f-note" maxlength="160" placeholder="a little note…"></textarea>
    <label>Love meter</label>
    <div class="rate" id="rate"><span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span></div>
    <label for="f-img">Cover picture (optional)</label>
    <input id="f-img" type="file" accept="image/*">
    <div class="file-note">Pick any image from your computer or phone.</div>
    <div class="row"><button type="button" class="cancel" id="cancel">Cancel</button><button type="submit" class="save">Save ♡</button></div>
  </form>
</div>
<script src="app.js?v=galaxy1"></script>
</body>
</html>
